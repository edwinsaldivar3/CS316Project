<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>

<body>

    <h1>Form</h1>

  

    <br><br>

    <form>
        <fieldset>

            <legend>My Form</legend>

            <label for="entry_name">Name:</label>
            <input type="text" id="entry_name" name="entry_name">
            <br>

            <label for="secret">Password:</label>
            <input type="password" name="secret" id="secret" required>
            <br>

            <label for="year">Year:</label>
            <select id="year" name="year">
                <option value="freshman">Freshman</option>
                <option value="soph">Sophomore</option>
                <option value="jun">Junior</option>
                <option value="sen">Senior</option>
            </select>
            <br>

            <label for="message">Write Something:</label>
            <br>
            <textarea name="message" id="message" rows="10" cols="30"></textarea>
            <br>

            <input type="submit" value="Finished">

        </fieldset>
    </form>
    <a href="index.html">Home</a>

</body>
</html>
